<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="goldLuster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#9E7618"/>
      <stop offset="100%" stop-color="#543B03"/>
    </linearGradient>

    <!-- Divine Lapis Lazuli -->
    <linearGradient id="lapisDivine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3F73"/>
      <stop offset="50%" stop-color="#0E2147"/>
      <stop offset="100%" stop-color="#050E24"/>
    </linearGradient>

    <!-- Egyptian Crimson Red (Upper Egypt Crown) -->
    <linearGradient id="deshretRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D93829"/>
      <stop offset="60%" stop-color="#9C180E"/>
      <stop offset="100%" stop-color="#590A04"/>
    </linearGradient>

    <!-- Pure White (Hedjet White Crown) -->
    <linearGradient id="hedjetWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E8E2D1"/>
      <stop offset="100%" stop-color="#B8AF98"/>
    </linearGradient>

    <!-- Turquoise Collar -->
    <linearGradient id="turquoiseSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52E0E7"/>
      <stop offset="50%" stop-color="#199AA8"/>
      <stop offset="100%" stop-color="#0C525B"/>
    </linearGradient>

    <!-- Falcon Feather Tone -->
    <linearGradient id="falconFeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3B32"/>
      <stop offset="50%" stop-color="#2D211A"/>
      <stop offset="100%" stop-color="#1A120E"/>
    </linearGradient>

    <!-- Soft Aura Filter -->
    <filter id="horusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Divine Halo -->
  <circle cx="130" cy="130" r="124" fill="url(#lapisDivine)" stroke="url(#goldLuster)" stroke-width="5" filter="url(#horusGlow)"/>
  <circle cx="130" cy="130" r="116" fill="none" stroke="#D4AF37" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.65"/>

  <!-- Solar Sun Disk Behind Head -->
  <circle cx="130" cy="90" r="62" fill="url(#goldLuster)" opacity="0.25"/>

  <!-- Wesekh Broad Collar (Necklace) -->
  <path d="M 60 195 C 80 238 180 238 200 195 C 180 216 155 226 130 226 C 105 226 80 216 60 195 Z" fill="url(#goldLuster)" stroke="#543B03" stroke-width="2"/>
  <path d="M 75 204 C 95 230 165 230 185 204" stroke="url(#turquoiseSheen)" stroke-width="6" fill="none"/>
  <path d="M 88 214 C 102 232 158 232 172 214" stroke="url(#lapisDivine)" stroke-width="4.5" fill="none"/>

  <!-- Pschent Double Crown of Egypt -->
  <!-- White Crown (Hedjet) Tall Central Cone -->
  <path d="M 115 110 C 110 65 118 18 130 12 C 142 18 150 65 145 110 Z" fill="url(#hedjetWhite)" stroke="url(#goldLuster)" stroke-width="2.5"/>
  <circle cx="130" cy="14" r="5" fill="url(#goldLuster)"/>

  <!-- Red Crown (Deshret) Backing and Curl -->
  <path d="M 96 112 C 90 92 98 75 116 70 L 115 112 Z" fill="url(#deshretRed)" stroke="#590A04" stroke-width="1.5"/>
  <path d="M 144 112 L 145 70 C 162 75 170 92 164 112 Z" fill="url(#deshretRed)" stroke="#590A04" stroke-width="1.5"/>
  <!-- Front Spiral Curl of Red Crown -->
  <path d="M 148 76 Q 166 40 156 32 Q 146 25 140 38" stroke="url(#goldLuster)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Royal Uraeus Cobra on Forehead -->
  <path d="M 130 108 Q 126 95 130 88 Q 134 82 130 76" stroke="url(#goldLuster)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="130" cy="74" r="4.5" fill="url(#deshretRed)" stroke="url(#goldLuster)" stroke-width="1"/>

  <!-- Falcon Head & Plumage -->
  <!-- Back of Head / Neck Feathers -->
  <path d="M 90 125 C 80 155 88 185 105 195 L 155 195 C 172 185 180 155 170 125 C 160 115 100 115 90 125 Z" fill="url(#falconFeather)" stroke="#1A120E" stroke-width="2"/>

  <!-- Falcon Cheeks & Side Markings (Classic Horus Facial Plumage) -->
  <path d="M 92 130 C 95 160 112 180 130 180 C 148 180 165 160 168 130 C 150 122 110 122 92 130 Z" fill="#EADECA" stroke="#9E8D77" stroke-width="1.5"/>

  <!-- Distinctive Eye of Horus (Udjat) Markings -->
  <!-- Left Side Plumage Stripe -->
  <path d="M 100 148 Q 98 172 108 178" stroke="#0E2147" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 103 162 Q 95 168 93 175" stroke="#0E2147" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Right Side Plumage Stripe -->
  <path d="M 160 148 Q 162 172 152 178" stroke="#0E2147" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 157 162 Q 165 168 167 175" stroke="#0E2147" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Divine Falcon Eyes (Udjat Style) -->
  <!-- Left Eye -->
  <path d="M 100 138 Q 112 130 124 138 Q 112 144 100 138 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2.2"/>
  <circle cx="112" cy="137" r="4.2" fill="url(#goldLuster)"/>
  <circle cx="112" cy="137" r="2.5" fill="#000000"/>
  <circle cx="113.5" cy="135.5" r="1.2" fill="#FFFFFF"/>
  <path d="M 100 138 L 94 140" stroke="#000000" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right Eye -->
  <path d="M 136 138 Q 148 130 160 138 Q 148 144 136 138 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2.2"/>
  <circle cx="148" cy="137" r="4.2" fill="url(#goldLuster)"/>
  <circle cx="148" cy="137" r="2.5" fill="#000000"/>
  <circle cx="149.5" cy="135.5" r="1.2" fill="#FFFFFF"/>
  <path d="M 160 138 L 166 140" stroke="#000000" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Golden Hooked Falcon Beak -->
  <path d="M 124 140 Q 130 138 136 140 L 138 156 Q 130 174 122 156 Z" fill="url(#goldLuster)" stroke="#543B03" stroke-width="2"/>
  <path d="M 130 142 L 130 166" stroke="#9E7618" stroke-width="1.5"/>
  <circle cx="127" cy="146" r="1.2" fill="#332200"/>
  <circle cx="133" cy="146" r="1.2" fill="#332200"/>

  <!-- Sparkling Divine Star -->
  <path d="M 210 50 L 214 58 L 222 62 L 214 66 L 210 74 L 206 66 L 198 62 L 206 58 Z" fill="url(#goldLuster)" opacity="0.9"/>
  <circle cx="210" cy="62" r="2" fill="#FFFFFF"/>
</svg>
